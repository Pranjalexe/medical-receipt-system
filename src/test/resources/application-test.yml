# Application Configuration for Testing Profile
spring:
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    database-platform: org.hibernate.dialect.H2Dialect

  cache:
    type: none

app:
  jwt:
    secret: TestSecretKeyThatIsAtLeast256BitsLongForHS256AlgorithmForTestingPurposes
    expiration-ms: 3600000

  receipt:
    storage-path: ./test-receipts

openfda:
  api:
    base-url: https://api.fda.gov/drug/ndc.json
    timeout: 5000

logging:
  level:
    com.medreceipt: WARN
